name = "kala-rooms"
main = "./src/worker.js"
compatibility_date = "2026-11-04"

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "KalaRoom"

[exports.KalaRoom]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
